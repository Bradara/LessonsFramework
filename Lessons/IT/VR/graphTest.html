<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Dynamic 3D Graph Test - WebXR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <script>
      // 1. Component for interaction (Change color on mouse over)
      AFRAME.registerComponent('node-interaction', {
        init: function () {
          var el = this.el;
          var originalColor = el.getAttribute('material').color;
          var descriptionPanel = document.querySelector('#description-panel');
          var descriptionText = document.querySelector('#description-text');
          
          el.addEventListener('mouseenter', function () {
            el.setAttribute('color', '#FF5722'); // Orange color on hover
            el.setAttribute('scale', '1.3 1.3 1.3'); // Slight scaling
            
            // Show description
            var description = el.getAttribute('data-description');
            if (description && descriptionText && descriptionPanel) {
              descriptionText.setAttribute('value', description);
              descriptionPanel.setAttribute('visible', 'true');
            }
          });
          
          el.addEventListener('mouseleave', function () {
            el.setAttribute('color', originalColor); // Return original color
            el.setAttribute('scale', '1 1 1');
            
            // Hide description
            if (descriptionPanel) {
              descriptionPanel.setAttribute('visible', 'false');
            }
          });
        }
      });

      // 2. Main logic for generating graph after scene loading
      window.addEventListener('DOMContentLoaded', (event) => {
        const scene = document.querySelector('a-scene');

        // Data for nodes (Example: Cities with their 3D coordinates X, Y, Z)
        // Z is negative so objects are in front of the camera
        const nodes = [
          { id: 'Sofia', x: -2, y: 1.5, z: -4, color: '#3F51B5', description: 'Sofia is the capital of Bulgaria. Population around 1.2 million.' },
          { id: 'Plovdiv', x: -0.5, y: 1.0, z: -5, color: '#E91E63', description: 'Plovdiv is the second largest city. Rich ancient history.' },
          { id: 'Burgas', x: 2, y: 1.2, z: -4, color: '#00BCD4', description: 'Burgas is a major city on the Black Sea coast. Popular tourism destination.' },
          { id: 'Varna', x: 2.5, y: 2.2, z: -5, color: '#4CAF50', description: 'Varna is the queen of the Black Sea beaches. Important northern port city.' },
          { id: 'Ruse', x: 0.5, y: 2.5, z: -4.5, color: '#FFEB3B', description: 'Ruse is a city on the Danube River. Important trade center.' }
        ];

        // Adjacency matrix / Connectivity (edges) between cities
        const links = [
          { from: 'Sofia', to: 'Plovdiv' },
          { from: 'Plovdiv', to: 'Burgas' },
          { from: 'Burgas', to: 'Varna' },
          { from: 'Varna', to: 'Ruse' },
          { from: 'Ruse', to: 'Sofia' },
          { from: 'Plovdiv', to: 'Ruse' } // Допълнителна връзка
        ];

        // GENERATE NODES (SPHERES)
        nodes.forEach(node => {
          // Create sphere
          let sphere = document.createElement('a-sphere');
          sphere.setAttribute('position', `${node.x} ${node.y} ${node.z}`);
          sphere.setAttribute('radius', '0.25');
          sphere.setAttribute('color', node.color);
          sphere.setAttribute('class', 'interactive'); // Important for raycaster
          sphere.setAttribute('data-description', node.description); // Add description
          sphere.setAttribute('node-interaction', ''); // Enable JS component
          
          // Add text label above each sphere
          let text = document.createElement('a-text');
          text.setAttribute('value', node.id);
          text.setAttribute('position', `-0.4 0.4 0`); // Slightly above sphere
          text.setAttribute('scale', '0.7 0.7 0.7');
          text.setAttribute('color', '#FFFFFF');
          text.setAttribute('align', 'center');
          
          sphere.appendChild(text);
          scene.appendChild(sphere);
        });

        // GENERATE EDGES (LINES / THIN CYLINDERS)
        // For simplicity we use the built-in <a-entity line="..."> component of A-Frame
        links.forEach(link => {
          const startNode = nodes.find(n => n.id === link.from);
          const endNode = nodes.find(n => n.id === link.to);

          if (startNode && endNode) {
            let line = document.createElement('a-entity');
            line.setAttribute('line', {
              start: `${startNode.x}, ${startNode.y}, ${startNode.z}`,
              end: `${endNode.x}, ${endNode.y}, ${endNode.z}`,
              color: '#888888',
              opacity: 0.6
            });
            scene.appendChild(line);
          }
        });
      });
    </script>
  </head>
  
  <body>
    <a-scene>
      <a-sky color="#0d1117"></a-sky>

      <a-entity id="light" position="1 4 2" light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>

      <a-entity position="0 1.6 0">
        <a-camera></a-camera>
        <a-entity laser-controls="hand: right" raycaster="objects: .interactive"></a-entity>
      </a-entity>

      <a-plane position="0 3.2 -3.5" width="2.5" height="0.6" color="#161b22" opacity="0.9">
        <a-text value="Dynamic Network (Graph)" align="center" color="#FFF" scale="0.6 0.6 0.6" position="0 0.1 0.01"></a-text>
        <a-text value="Point at a city to activate" align="center" color="#8b949e" scale="0.4 0.4 0.4" position="0 -0.1 0.01"></a-text>
      </a-plane>

      <a-plane id="description-panel" position="0 1.5 -3.5" width="3" height="1.2" color="#1c2128" opacity="0.95" visible="false">
        <a-text id="description-text" value="" align="center" color="#e6edf3" scale="0.5 0.5 0.5" position="0 0 0.01" width="5"></a-text>
      </a-plane>
      
    </a-scene>
  </body>
</html>

<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Въведение в информационните технологии и компютърните системи - Образователен Портал</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="../../../libs/font-awesome/all.min.css">

    <!-- H5P Standalone player (локален, за H5P ресурси от подпапка H5P/) -->
    <link rel="stylesheet" href="../../../libs/h5p-standalone/dist/styles/h5p.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 2rem;
            color: #333;
            line-height: 1.7;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.95;
        }

        .content {
            padding: 3rem 2.5rem;
        }

        .presentation-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .presentation-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .section-title {
            margin-top: 3rem;
            margin-bottom: 1rem;
            font-size: 1.6rem;
            font-weight: 700;
            color: #333;
        }

        .h5p-wrapper {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .actions {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-decoration: none;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .back-button:active {
            transform: translateY(0);
        }

        .footer {
            background: #f8f9fa;
            padding: 2rem;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 1rem;
            }

            .content {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1><i class="fas fa-microchip"></i> Въведение в ИТ и компютърните системи</h1>
                <p>KMIT - 5 клас</p>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="presentation-wrapper">
                <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vTLXcumBYzHjhQ7c6bMugD7zKow08A43uKPHxp34rHohfyxEqQfj7I4wGZBJ9ENYMnDQ0nLI4MoAd-p/pubembed?start=false&loop=false&delayms=60000" frameborder="0" width="1707" height="989" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
            </div>

            <h2 class="section-title"><i class="fas fa-circle-question"></i> Куиз</h2>
            <div id="h5p-container" class="h5p-wrapper"></div>

            <div class="actions">
                <a href="../../../index.html" class="back-button">
                    <i class="fas fa-arrow-left"></i>
                    Назад към уроците
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 Образователен Портал | Създадено с ❤️ за ученето</p>
        </div>
    </div>

    <script>
        // Случаен фон на страницата от папка backgrounds/
        (function () {
            const backgrounds = [
                '../../../backgrounds/IT.jpg',
                '../../../backgrounds/Informatics.jpg',
                '../../../backgrounds/Lessons.jpg',
                '../../../backgrounds/Malta.jpg',
                '../../../backgrounds/Modul1.jpg',
                '../../../backgrounds/Modul2.jpg',
                '../../../backgrounds/Modul2.png',
                '../../../backgrounds/Modul3.jpg',
                '../../../backgrounds/Modul4.jpg',
                '../../../backgrounds/Other.jpg',
                '../../../backgrounds/Start.jpg'
            ];
            const pick = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            document.body.style.backgroundImage =
                `linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.45)), url('${pick}')`;
        })();
    </script>

    <!-- H5P Standalone player: рендира H5P ресурса от локалната подпапка H5P/Urok2 -->
    <script src="../../../libs/h5p-standalone/dist/main.bundle.js" charset="UTF-8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new H5PStandalone.H5P(document.getElementById('h5p-container'), {
                h5pJsonPath: 'H5P/Urok2',
                librariesPath: '../../../libs/h5p-libraries',
                frameJs: '../../../libs/h5p-standalone/dist/frame.bundle.js',
                frameCss: '../../../libs/h5p-standalone/dist/styles/h5p.css'
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Въведение в информационните технологии и компютърните системи - Образователен Портал</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="../../../libs/font-awesome/all.min.css">

    <!-- H5P Standalone player (локален, за H5P ресурси от подпапка H5P/) -->
    <link rel="stylesheet" href="../../../libs/h5p-standalone/dist/styles/h5p.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 2rem;
            color: #333;
            line-height: 1.7;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.95;
        }

        .content {
            padding: 3rem 2.5rem;
        }

        .presentation-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .presentation-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .section-title {
            margin-top: 3rem;
            margin-bottom: 1rem;
            font-size: 1.6rem;
            font-weight: 700;
            color: #333;
        }

        .h5p-wrapper {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .footer {
            background: #f8f9fa;
            padding: 2rem;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 1rem;
            }

            .content {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1><i class="fas fa-microchip"></i> Въведение в ИТ и компютърните системи</h1>
                <p>KMIT - 5 клас</p>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="presentation-wrapper">
                <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vTLXcumBYzHjhQ7c6bMugD7zKow08A43uKPHxp34rHohfyxEqQfj7I4wGZBJ9ENYMnDQ0nLI4MoAd-p/pubembed?start=false&loop=false&delayms=60000" frameborder="0" width="1707" height="989" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
            </div>

            <h2 class="section-title"><i class="fas fa-circle-question"></i> Куиз</h2>
            <div id="h5p-container" class="h5p-wrapper"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 Образователен Портал | Създадено с ❤️ за ученето</p>
        </div>
    </div>

    <script>
        // Случаен фон на страницата от папка backgrounds/
        (function () {
            const backgrounds = [
                '../../../backgrounds/IT.jpg',
                '../../../backgrounds/Informatics.jpg',
                '../../../backgrounds/Lessons.jpg',
                '../../../backgrounds/Malta.jpg',
                '../../../backgrounds/Modul1.jpg',
                '../../../backgrounds/Modul2.jpg',
                '../../../backgrounds/Modul2.png',
                '../../../backgrounds/Modul3.jpg',
                '../../../backgrounds/Modul4.jpg',
                '../../../backgrounds/Other.jpg',
                '../../../backgrounds/Start.jpg'
            ];
            const pick = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            document.body.style.backgroundImage =
                `linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.45)), url('${pick}')`;
        })();
    </script>

    <!-- H5P Standalone player: рендира H5P ресурса от локалната подпапка H5P/Urok2 -->
    <script src="../../../libs/h5p-standalone/dist/main.bundle.js" charset="UTF-8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new H5PStandalone.H5P(document.getElementById('h5p-container'), {
                h5pJsonPath: 'H5P/Urok2',
                librariesPath: '../../../libs/h5p-libraries',
                frameJs: '../../../libs/h5p-standalone/dist/frame.bundle.js',
                frameCss: '../../../libs/h5p-standalone/dist/styles/h5p.css'
            });
        });
    </script>

<!-- fullscreen-toggle: мини бутон горе вдясно за цял екран (виж README). В Moodle iframe-ът трябва да има allowfullscreen, иначе бутонът се скрива сам. -->
<style>
#fs-toggle{position:fixed;top:10px;right:10px;z-index:2147483000;width:34px;height:34px;padding:0;border:0;border-radius:8px;background:rgba(15,23,42,.55);color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;opacity:.75;transition:opacity .2s,background .2s}
#fs-toggle:hover,#fs-toggle:focus-visible{opacity:1;background:rgba(15,23,42,.9)}
#fs-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<button id="fs-toggle" type="button" title="Цял екран" aria-label="Цял екран"></button>
<script>
(function () {
    var btn = document.getElementById('fs-toggle');
    var root = document.documentElement;
    var enter = root.requestFullscreen || root.webkitRequestFullscreen;
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (!btn || !enter || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) return;
    var IN = '<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
    var OUT = '<svg viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>';
    function active() { return document.fullscreenElement || document.webkitFullscreenElement; }
    function sync() {
        btn.innerHTML = active() ? OUT : IN;
        var t = active() ? 'Изход от цял екран' : 'Цял екран';
        btn.title = t; btn.setAttribute('aria-label', t);
    }
    btn.addEventListener('click', function () {
        try { active() ? exit.call(document) : enter.call(root); } catch (e) {}
    });
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
    sync();
    btn.style.display = 'inline-flex';
})();
</script>
</body>
</html>

/* ═══════════════════════════════════════════════
   FLASH CARDS SECTION
═══════════════════════════════════════════════ */
function FlashCards() {
  const [current, setCurrent] = useState(0);
  const [flipped, setFlipped] = useState({});

  const toggle = (i) => setFlipped(f => ({ ...f, [i]: !f[i] }));
  const prev = () => { setCurrent(c => Math.max(0, c - 1)); };
  const next = () => { setCurrent(c => Math.min(FLASH_CARDS.length - 1, c + 1)); };

  return (
    <div className="max-w-2xl mx-auto px-4 py-8">
      <h2 className="text-2xl font-bold text-center mb-2" style={{ color: 'var(--accent)' }}>
        <i className="fas fa-layer-group mr-2" />Флаш карти
      </h2>
      <p className="text-center mb-8" style={{ color: 'var(--text-muted)' }}>
        Карта {current + 1} от {FLASH_CARDS.length} — Кликни върху картата, за да я обърнеш
      </p>

      {/* Card */}
      <div className="card-scene mx-auto mb-8" style={{ width: '100%', height: '220px' }}>
        <div
          className={`card-inner cursor-pointer${flipped[current] ? ' flipped' : ''}`}
          onClick={() => toggle(current)}
        >
          {/* Front */}
          <div className="card-face" style={{ background: 'var(--bg-secondary)', border: '1px solid rgba(34,197,94,0.3)' }}>
            <span className="text-xs font-semibold uppercase tracking-widest mb-3" style={{ color: 'var(--accent)' }}>
              Термин
            </span>
            <span className="text-2xl font-bold text-center font-code" style={{ color: 'var(--text-primary)' }}>
              {FLASH_CARDS[current].front}
            </span>
            <span className="text-xs mt-4" style={{ color: 'var(--text-muted)' }}>
              <i className="fas fa-sync-alt mr-1" /> Кликни за обяснение
            </span>
          </div>
          {/* Back */}
          <div className="card-face card-back" style={{ background: 'linear-gradient(135deg,#1e293b,#0f172a)', border: '1px solid rgba(34,197,94,0.6)' }}>
            <span className="text-xs font-semibold uppercase tracking-widest mb-3" style={{ color: 'var(--accent)' }}>
              Обяснение
            </span>
            <p className="text-lg text-center leading-relaxed" style={{ color: 'var(--text-primary)' }}>
              {FLASH_CARDS[current].back}
            </p>
          </div>
        </div>
      </div>

      {/* Navigation */}
      <div className="flex items-center justify-between gap-4">
        <button
          onClick={prev}
          disabled={current === 0}
          className="flex-1 py-3 rounded-xl font-semibold transition-all"
          style={{
            background: current === 0 ? '#1e293b' : 'var(--bg-secondary)',
            color: current === 0 ? 'var(--text-muted)' : 'var(--text-primary)',
            border: '1px solid #334155',
          }}
        >
          <i className="fas fa-chevron-left mr-2" />Предишна
        </button>

        {/* Dots */}
        <div className="flex gap-1.5">
          {FLASH_CARDS.map((_, i) => (
            <button
              key={i}
              onClick={() => setCurrent(i)}
              className="w-2.5 h-2.5 rounded-full transition-all"
              style={{ background: i === current ? 'var(--accent)' : '#334155' }}
            />
          ))}
        </div>

        <button
          onClick={next}
          disabled={current === FLASH_CARDS.length - 1}
          className="flex-1 py-3 rounded-xl font-semibold transition-all"
          style={{
            background: current === FLASH_CARDS.length - 1 ? '#1e293b' : 'var(--accent)',
            color: current === FLASH_CARDS.length - 1 ? 'var(--text-muted)' : '#0f172a',
            border: '1px solid transparent',
          }}
        >
          Следваща<i className="fas fa-chevron-right ml-2" />
        </button>
      </div>

      {/* Grid overview */}
      <div className="mt-10">
        <h3 className="text-sm font-semibold uppercase tracking-wider mb-4" style={{ color: 'var(--text-muted)' }}>
          Всички карти
        </h3>
        <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
          {FLASH_CARDS.map((card, i) => (
            <button
              key={i}
              onClick={() => { setCurrent(i); setFlipped(f => ({ ...f, [i]: false })); }}
              className="p-3 rounded-lg text-left transition-all"
              style={{
                background: i === current ? 'rgba(34,197,94,0.15)' : 'var(--bg-secondary)',
                border: `1px solid ${i === current ? 'var(--accent)' : '#334155'}`,
                color: i === current ? 'var(--accent)' : 'var(--text-primary)',
              }}
            >
              <span className="text-xs" style={{ color: 'var(--text-muted)' }}>{i + 1}.</span>
              <p className="text-sm font-semibold mt-0.5 font-code">{card.front}</p>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   QUIZ SECTION
═══════════════════════════════════════════════ */
function Quiz() {
  const [current, setCurrent] = useState(0);
  const [score, setScore] = useState(0);
  const [selected, setSelected] = useState(null);
  const [finished, setFinished] = useState(false);

  const q = QUIZ_QUESTIONS[current];

  const choose = (idx) => {
    if (selected !== null) return;
    setSelected(idx);
    if (idx === q.correct) setScore(s => s + 1);
    setTimeout(() => {
      if (current + 1 < QUIZ_QUESTIONS.length) {
        setCurrent(c => c + 1);
        setSelected(null);
      } else {
        setFinished(true);
      }
    }, 1200);
  };

  const restart = () => { setCurrent(0); setScore(0); setSelected(null); setFinished(false); };

  const pct = Math.round((score / QUIZ_QUESTIONS.length) * 100);
  const msg =
    pct >= 90 ? 'Отличен резултат! 🏆' :
    pct >= 70 ? 'Много добре! Продължавай така.' :
    pct >= 50 ? 'Добре, но има какво да доработиш.' :
                'Прегледай материала отново.';

  if (finished) return (
    <div className="max-w-lg mx-auto px-4 py-12 text-center">
      <div className="w-28 h-28 rounded-full mx-auto mb-6 flex items-center justify-center text-5xl"
        style={{ background: 'rgba(34,197,94,0.15)', border: '3px solid var(--accent)' }}>
        {pct >= 70 ? '🏆' : '📚'}
      </div>
      <h2 className="text-3xl font-bold mb-2" style={{ color: 'var(--accent)' }}>
        {score} / {QUIZ_QUESTIONS.length}
      </h2>
      <p className="text-xl mb-2" style={{ color: 'var(--text-primary)' }}>{pct}%</p>
      <p className="text-lg mb-8" style={{ color: 'var(--text-muted)' }}>{msg}</p>

      {/* Bar */}
      <div className="w-full h-3 rounded-full mb-8" style={{ background: '#1e293b' }}>
        <div className="h-3 rounded-full transition-all" style={{ width: `${pct}%`, background: 'var(--accent)' }} />
      </div>

      <button onClick={restart} className="px-8 py-3 rounded-xl font-bold text-lg transition-all"
        style={{ background: 'var(--accent)', color: '#0f172a' }}>
        <i className="fas fa-redo mr-2" />Опитай пак
      </button>
    </div>
  );

  return (
    <div className="max-w-2xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between mb-6">
        <span className="text-sm font-semibold" style={{ color: 'var(--text-muted)' }}>
          Въпрос {current + 1} / {QUIZ_QUESTIONS.length}
        </span>
        <span className="px-3 py-1 rounded-full text-sm font-bold font-code"
          style={{ background: 'rgba(34,197,94,0.15)', color: 'var(--accent)' }}>
          {score} т.
        </span>
      </div>

      {/* Progress bar */}
      <div className="w-full h-1.5 rounded-full mb-8" style={{ background: '#1e293b' }}>
        <div className="h-1.5 rounded-full transition-all"
          style={{ width: `${((current) / QUIZ_QUESTIONS.length) * 100}%`, background: 'var(--accent)' }} />
      </div>

      <div className="p-6 rounded-2xl mb-6" style={{ background: 'var(--bg-secondary)', border: '1px solid #334155' }}>
        <p className="text-lg font-semibold leading-relaxed" style={{ color: 'var(--text-primary)' }}>
          {q.q}
        </p>
      </div>

      <div className="grid gap-3">
        {q.options.map((opt, i) => {
          let bg = 'var(--bg-secondary)';
          let border = '#334155';
          let color = 'var(--text-primary)';
          if (selected !== null) {
            if (i === q.correct) { bg = 'rgba(34,197,94,0.2)'; border = 'var(--accent)'; color = 'var(--accent)'; }
            else if (i === selected && i !== q.correct) { bg = 'rgba(239,68,68,0.15)'; border = '#ef4444'; color = '#ef4444'; }
          }
          return (
            <button
              key={i}
              onClick={() => choose(i)}
              disabled={selected !== null}
              className="answer-btn w-full text-left px-5 py-4 rounded-xl font-medium text-base transition-all"
              style={{ background: bg, border: `1px solid ${border}`, color }}
            >
              <span className="font-bold mr-3 font-code" style={{ color: 'var(--text-muted)' }}>
                {['A', 'B', 'C', 'D'][i]}.
              </span>
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

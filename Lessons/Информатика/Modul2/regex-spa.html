  <!-- Matrix canvas effect -->
  <script>
    (function(){
      const canvas = document.getElementById('matrix-bg');
      const ctx = canvas.getContext('2d');
      const chars = '01アイウエオカキクケコ∀∃∈∉⊂⊃∪∩→←↑↓≠≡±∞∂∇λΣΠ';
      let cols, drops;
      function init(){
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        cols  = Math.floor(canvas.width / 18);
        drops = Array.from({length: cols}, () => Math.random() * -50);
      }
      function draw(){
        ctx.fillStyle = 'rgba(15,23,42,0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = '13px Fira Code, monospace';
        drops.forEach((y, i) => {
          const ch = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(ch, i * 18, y * 18);
          if (y * 18 > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i] += 0.5;
        });
      }
      init();
      window.addEventListener('resize', init);
      setInterval(draw, 50);
    })();
  </script>

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function buildHighlightedHtml(text, pattern, flags) {
      if (!pattern) return { html: escapeHtml(text), count: 0, error: '' };
      try {
        const safeFlags = flags.replace(/[^gimsuy]/g, '');
        const re = new RegExp(pattern, safeFlags.includes('g') ? safeFlags : safeFlags + 'g');
        const matches = [];
        let m;
        while ((m = re.exec(text)) !== null) {
          matches.push({ start: m.index, end: m.index + m[0].length });
          if (m[0].length === 0) re.lastIndex++;
          if (matches.length > 500) break; // safety
        }
        let html = '', last = 0;
        for (const { start, end } of matches) {
          html += escapeHtml(text.slice(last, start));
          html += `<mark class="match-hl">${escapeHtml(text.slice(start, end))}</mark>`;
          last = end;
        }
        html += escapeHtml(text.slice(last));
        return { html, count: matches.length, error: '' };
      } catch (e) {
        return { html: escapeHtml(text), count: 0, error: e.message };
      }
    }

    /* ======================================================
       QUIZ
    ====================================================== */

    function Quiz() {
      const [answers,   setAnswers]   = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [cur,       setCur]       = useState(0);

      const select = (qId, opt) => {
        if (!submitted) {
          setAnswers(a => ({ ...a, [qId]: opt }));
        }
      };

      const score = useMemo(() =>
        QUIZ.reduce((s, q) => s + (answers[q.id] === q.ans ? 1 : 0), 0),
      [answers]);

      const allDone = Object.keys(answers).length === QUIZ.length;
      const reset   = () => { setAnswers({}); setSubmitted(false); setCur(0); };

      const feedback = s => {
        if (s >= 9) return { emoji: '🏆', msg: 'Отличен! Истински RegEx майстор!',       color: '#4ade80' };
        if (s >= 7) return { emoji: '⭐', msg: 'Много добър! Много добре разбираш материала.', color: '#67e8f9' };
        if (s >= 5) return { emoji: '👍', msg: 'Добър! Повтори материала за по-добър резултат.', color: '#fcd34d' };
        return           { emoji: '📖', msg: 'Прегледай отново презентацията и флаш картите.', color: '#f87171' };
      };

      const q = QUIZ[cur];
      const fb = feedback(score);

      return (
        <div className="min-h-screen px-4 pb-16" style={{paddingTop: '80px'}}>
          <div className="max-w-3xl mx-auto">
            <div className="text-center mb-8 fade-in">
              <h2 className="text-3xl font-bold text-white mb-1">🏆 Куиз</h2>
              <p className="text-slate-400">10 въпроса — провери знанията си</p>
            </div>

            {submitted ? (
              /* ---- Results ---- */
              <div className="fade-in">
                <div className="text-center p-8 rounded-2xl mb-8"
                  style={{
                    background: 'linear-gradient(135deg, rgba(34,197,94,0.1), rgba(6,182,212,0.08))',
                    border: '1px solid rgba(34,197,94,0.28)',
                    boxShadow: '0 0 40px rgba(34,197,94,0.1)',
                  }}>
                  <div className="text-7xl mb-4">{fb.emoji}</div>
                  <div className="text-5xl font-bold font-code mb-3" style={{color: fb.color}}>
                    {score} / 10
                  </div>
                  <p className="text-lg text-slate-300 mb-5">{fb.msg}</p>
                  <div className="flex justify-center gap-3 flex-wrap">
                    <span className="px-3 py-1.5 rounded-full text-sm font-medium"
                      style={{background: 'rgba(34,197,94,0.18)', color: '#4ade80'}}>
                      ✓ {score} верни
                    </span>
                    <span className="px-3 py-1.5 rounded-full text-sm font-medium"
                      style={{background: 'rgba(239,68,68,0.15)', color: '#f87171'}}>
                      ✗ {10 - score} грешни
                    </span>
                  </div>
                </div>

                {/* Review */}
                <div className="space-y-3 mb-8">
                  {QUIZ.map((q, i) => {
                    const ok = answers[q.id] === q.ans;
                    return (
                      <div key={q.id} className="p-4 rounded-xl"
                        style={{
                          background: ok ? 'rgba(34,197,94,0.06)' : 'rgba(239,68,68,0.06)',
                          border: `1px solid ${ok ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)'}`,
                        }}>
                        <div className="flex gap-3">
                          <span className="text-lg shrink-0">{ok ? '✅' : '❌'}</span>
                          <div>
                            <p className="text-white text-sm font-medium">{i + 1}. {q.q}</p>
                            <p className="text-xs mt-1" style={{color: ok ? '#4ade80' : '#f87171'}}>
                              Твоят отговор: <em>{q.opts[answers[q.id]] ?? '—'}</em>
                              {!ok && ` · Правилно: ${q.opts[q.ans]}`}
                            </p>
                            <p className="text-slate-500 text-xs mt-1 italic">{q.exp}</p>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="text-center">
                  <button onClick={reset}
                    className="px-8 py-3 rounded-xl font-semibold text-white transition-all hover:scale-105"
                    style={{
                      background: 'linear-gradient(135deg, #22c55e, #16a34a)',
                      boxShadow: '0 0 24px rgba(34,197,94,0.35)',
                    }}>
                    🔄 Пробвай отново
                  </button>
                </div>
              </div>
            ) : (
              /* ---- Questions ---- */
              <div>
                {/* Progress */}
                <div className="flex items-center gap-3 mb-5">
                  <span className="font-code text-green-400 text-sm shrink-0">
                    {cur + 1} / {QUIZ.length}
                  </span>
                  <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-300"
                      style={{
                        width: `${((cur + 1) / QUIZ.length) * 100}%`,
                        background: 'linear-gradient(90deg, #22c55e, #06b6d4)',
                      }} />
                  </div>
                  <span className="font-code text-slate-500 text-sm shrink-0">{score} т.</span>
                </div>

                {/* Dot nav */}
                <div className="flex gap-1.5 mb-6 flex-wrap">
                  {QUIZ.map((qx, i) => {
                    const answered = answers[qx.id] !== undefined;
                    return (
                      <button key={i} onClick={() => setCur(i)}
                        className="w-7 h-7 rounded-full text-xs font-bold font-code transition-all"
                        style={{
                          background: answered
                            ? 'rgba(34,197,94,0.3)'
                            : i === cur ? 'rgba(34,197,94,0.15)' : 'rgba(255,255,255,0.04)',
                          border: i === cur ? '1px solid rgba(34,197,94,0.6)' : '1px solid rgba(255,255,255,0.08)',
                          color: i === cur ? '#4ade80' : answered ? '#86efac' : '#64748b',
                          transform: i === cur ? 'scale(1.15)' : 'scale(1)',
                        }}>
                        {i + 1}
                      </button>
                    );
                  })}
                </div>

                {/* Question card */}
                <div key={cur} className="slide-enter rounded-2xl p-6 mb-5"
                  style={{background: 'rgba(30,41,59,0.6)', border: '1px solid rgba(255,255,255,0.09)'}}>
                  <h3 className="text-lg font-semibold text-white mb-6 leading-relaxed">
                    {cur + 1}. {q.q}
                  </h3>
                  <div className="space-y-3">
                    {q.opts.map((opt, i) => (
                      <button key={i} onClick={() => { select(q.id, i); }}
                        className="w-full text-left p-4 rounded-xl text-sm transition-all duration-150 hover:scale-[1.01]"
                        style={{
                          background: answers[q.id] === i ? 'rgba(34,197,94,0.13)' : 'rgba(255,255,255,0.03)',
                          border: answers[q.id] === i
                            ? '1px solid rgba(34,197,94,0.5)'
                            : '1px solid rgba(255,255,255,0.07)',
                          color: answers[q.id] === i ? '#fff' : '#cbd5e1',
                        }}>
                        <span className="font-code font-bold text-green-400 mr-3">
                          {String.fromCharCode(65 + i)}.
                        </span>
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Bottom nav */}
                <div className="flex items-center justify-between gap-3">
                  <button onClick={() => setCur(c => Math.max(0, c - 1))} disabled={cur === 0}
                    className="px-5 py-2.5 rounded-xl text-sm font-medium transition-all disabled:opacity-25"
                    style={{background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.09)', color: '#94a3b8'}}>
                    ← Назад
                  </button>

                  {cur < QUIZ.length - 1 ? (
                    <button onClick={() => setCur(c => c + 1)}
                      className="px-5 py-2.5 rounded-xl text-sm font-medium transition-all"
                      style={{background: 'rgba(34,197,94,0.13)', border: '1px solid rgba(34,197,94,0.3)', color: '#4ade80'}}>
                      Следващ →
                    </button>
                  ) : (
                    <button onClick={() => setSubmitted(true)} disabled={!allDone}
                      className="px-6 py-2.5 rounded-xl text-sm font-bold text-white transition-all hover:scale-105 disabled:opacity-40"
                      style={{
                        background: allDone ? 'linear-gradient(135deg, #22c55e, #16a34a)' : 'rgba(34,197,94,0.15)',
                        boxShadow: allDone ? '0 0 20px rgba(34,197,94,0.3)' : 'none',
                      }}>
                      🏁 Провери резултата
                    </button>
                  )}
                </div>

                {!allDone && (
                  <p className="text-center text-slate-700 text-xs mt-3">
                    Отговори на всички {QUIZ.length} въпроса преди да провериш
                  </p>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

                border: '1px solid rgba(34,197,94,0.18)',
              }}>
              <div className="text-3xl mb-3">🚀</div>
              <p className="text-white font-semibold text-lg mb-1">Готов за следващото ниво?</p>
              <p className="text-slate-400 text-sm">
                Практикувай с реални задачи в секцията <strong className="text-green-400">Демо</strong>, или провери знанията си в <strong className="text-green-400">Куиза</strong>.
              </p>
            </div>
          </div>
        </div>
      );
    }

    /* ======================================================
       APP ROOT
    ====================================================== */

    function App() {
      const [section, setSection] = useState('presentation');

      return (
        <div className="bg-grid" style={{minHeight: '100vh'}}>
          <Nav active={section} setActive={setSection} />
          {section === 'presentation' && <Presentation />}
          {section === 'flashcards'   && <FlashCards />}
          {section === 'demo'         && <Demo />}
          {section === 'quiz'         && <Quiz />}
          {section === 'summary'      && <Summary />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

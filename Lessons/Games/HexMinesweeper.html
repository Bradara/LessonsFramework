<!doctype html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Minesweeper</title>
<style>
  :root {
    --bg: #1b1f27;
    --panel: #262c38;
    --panel-border: #3a4152;
    --text: #e8ecf4;
    --muted: #8a92a6;
    --accent: #ffb020;
    --cell-hidden: #4b5568;
    --cell-hidden-edge: #5c6785;
    --cell-revealed: #2e3543;
    --cell-revealed-edge: #3a4257;
    --mine-bg: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 16px;
    gap: 14px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  select, button {
    font-size: 15px;
    background: #333c4d;
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  select:hover, button:hover { background: #3d4759; }
  .counter {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 20px;
    font-weight: bold;
    background: #10131a;
    color: var(--accent);
    border-radius: 6px;
    padding: 4px 10px;
    min-width: 64px;
    text-align: center;
  }
  #resetBtn { font-size: 20px; padding: 4px 12px; }
  #boardWrap {
    max-width: 100%;
    max-height: 70vh;
    overflow: auto;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: #14171f;
    padding: 10px;
  }
  canvas { display: block; cursor: pointer; }
  #message {
    min-height: 26px;
    font-size: 16px;
    font-weight: bold;
  }
  #message.win { color: #6fd66f; }
  #message.lose { color: #ff6b6b; }
  #hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    max-width: 480px;
  }
</style>
</head>
<body>
<div id="app">
  <h1>⬡ Hex Minesweeper</h1>
  <div class="panel">
    <select id="difficulty">
      <option value="easy">Лесно</option>
      <option value="medium" selected>Средно</option>
      <option value="hard">Трудно</option>
    </select>
    <div class="counter" id="mineCounter">000</div>
    <button id="resetBtn" title="Нова игра">🙂</button>
    <div class="counter" id="timer">000</div>
  </div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
  </div>
  <div id="message"></div>
  <div id="hint">Ляв клик: разкрий клетка &nbsp;•&nbsp; Десен клик: флагче &nbsp;•&nbsp; Клик върху разкрито число: разкрий съседите (chord), ако флагчетата съвпадат</div>
</div>

<script>
(function () {
  "use strict";

  const DIFFICULTIES = {
    easy:   { radius: 5,  mineRatio: 0.14 },
    medium: { radius: 8,  mineRatio: 0.17 },
    hard:   { radius: 11, mineRatio: 0.20 },
  };

  const HEX_SIZE = 20; // "radius" of a single hexagon in px
  const SQRT3 = Math.sqrt(3);
  const NEIGHBOR_DIRS = [
    { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
    { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 },
  ];
  const NUMBER_COLORS = {
    1: "#4d8fe8", 2: "#5cbf5c", 3: "#e05f5f", 4: "#9d6fe0",
    5: "#c97b3d", 6: "#3fc4c4", 7: "#e8e8e8", 8: "#9aa2b5",
  };

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const boardWrap = document.getElementById("boardWrap");
  const difficultySelect = document.getElementById("difficulty");
  const mineCounterEl = document.getElementById("mineCounter");
  const timerEl = document.getElementById("timer");
  const resetBtn = document.getElementById("resetBtn");
  const messageEl = document.getElementById("message");

  let radius, mineCount, cells, allCoords, originX, originY;
  let firstClickDone, gameOver, win, revealedCount, flagCount;
  let timerSeconds, timerHandle;
  let dpr = window.devicePixelRatio || 1;

  function key(c) { return c.q + "," + c.r; }

  function neighbors(c) {
    return NEIGHBOR_DIRS.map(d => ({ q: c.q + d.q, r: c.r + d.r }));
  }

  function axialToPixel(q, r) {
    return {
      x: HEX_SIZE * SQRT3 * (q + r / 2),
      y: HEX_SIZE * 1.5 * r,
    };
  }

  function cubeRound(x, y, z) {
    let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
    const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
    if (dx > dy && dx > dz) rx = -ry - rz;
    else if (dy > dz) ry = -rx - rz;
    else rz = -rx - ry;
    return { x: rx, y: ry, z: rz };
  }

  function pixelToAxial(px, py) {
    const x = (SQRT3 / 3 * px - 1 / 3 * py) / HEX_SIZE;
    const z = (2 / 3 * py) / HEX_SIZE;
    const y = -x - z;
    const rc = cubeRound(x, y, z);
    return { q: rc.x, r: rc.z };
  }

  function buildBoard(rad) {
    radius = rad;
    cells = new Map();
    allCoords = [];
    for (let q = -radius; q <= radius; q++) {
      const r1 = Math.max(-radius, -q - radius);
      const r2 = Math.min(radius, -q + radius);
      for (let r = r1; r <= r2; r++) {
        const c = { q, r };
        allCoords.push(c);
        cells.set(key(c), {
          q, r, mine: false, revealed: false, flagged: false, adjacent: 0,
        });
      }
    }
  }

  function sizeCanvas() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const c of allCoords) {
      const p = axialToPixel(c.q, c.r);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    }
    const pad = HEX_SIZE * 1.2;
    const width = (maxX - minX) + pad * 2;
    const height = (maxY - minY) + pad * 2;
    originX = pad - minX;
    originY = pad - minY;

    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.ceil(width * dpr);
    canvas.height = Math.ceil(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
  }

  function hexPath(cx, cy) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = Math.PI / 180 * (60 * i - 30);
      const x = cx + HEX_SIZE * Math.cos(angle);
      const y = cy + HEX_SIZE * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const coord of allCoords) {
      const cell = cells.get(key(coord));
      const p = axialToPixel(coord.q, coord.r);
      const cx = p.x + originX, cy = p.y + originY;

      hexPath(cx, cy);
      if (cell.revealed) {
        ctx.fillStyle = cell.mine ? (cell.exploded ? "#e04b3f" : "#8f2a24") : "#2e3543";
        ctx.fill();
        ctx.strokeStyle = "#3a4257";
      } else {
        ctx.fillStyle = "#4b5568";
        ctx.fill();
        ctx.strokeStyle = "#5c6785";
      }
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (cell.revealed && cell.mine) {
        ctx.font = (HEX_SIZE * 1.1) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("💣", cx, cy + 1);
      } else if (cell.revealed && cell.adjacent > 0) {
        ctx.fillStyle = NUMBER_COLORS[cell.adjacent] || "#e8e8e8";
        ctx.font = "bold " + (HEX_SIZE * 0.95) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(cell.adjacent), cx, cy + 1);
      } else if (!cell.revealed && cell.flagged) {
        ctx.font = (HEX_SIZE * 1.0) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🚩", cx, cy + 1);
      }
    }
  }

  function placeMines(excludeCoord) {
    const excludeKeys = new Set([key(excludeCoord), ...neighbors(excludeCoord).map(key)]);
    const candidates = allCoords.filter(c => !excludeKeys.has(key(c)));
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    for (const c of candidates.slice(0, mineCount)) {
      cells.get(key(c)).mine = true;
    }
    for (const c of allCoords) {
      const cell = cells.get(key(c));
      if (cell.mine) continue;
      cell.adjacent = neighbors(c).filter(n => {
        const nc = cells.get(key(n));
        return nc && nc.mine;
      }).length;
    }
  }

  function revealFlood(startCoord) {
    const queue = [startCoord];
    while (queue.length) {
      const cur = queue.pop();
      const cell = cells.get(key(cur));
      if (!cell || cell.revealed || cell.flagged) continue;
      cell.revealed = true;
      revealedCount++;
      if (!cell.mine && cell.adjacent === 0) {
        for (const n of neighbors(cur)) {
          const nc = cells.get(key(n));
          if (nc && !nc.revealed && !nc.flagged) queue.push(n);
        }
      }
    }
  }

  function revealAllMines() {
    for (const c of allCoords) {
      const cell = cells.get(key(c));
      if (cell.mine) cell.revealed = true;
    }
  }

  function endGame(didWin) {
    gameOver = true;
    win = didWin;
    stopTimer();
    resetBtn.textContent = didWin ? "😎" : "💀";
    messageEl.textContent = didWin ? "Победа! Разчисти всички хексове." : "Гръмна! Опитай пак.";
    messageEl.className = didWin ? "win" : "lose";
    if (didWin) {
      for (const c of allCoords) {
        const cell = cells.get(key(c));
        if (cell.mine) cell.flagged = true;
      }
      updateMineCounter();
    } else {
      revealAllMines();
    }
    draw();
  }

  function handleLeftClick(coord) {
    if (gameOver) return;
    const cell = cells.get(key(coord));
    if (!cell) return;

    if (!firstClickDone) {
      firstClickDone = true;
      placeMines(coord);
      startTimer();
    }

    if (cell.flagged) return;

    if (cell.revealed && cell.adjacent > 0) {
      chord(coord);
      return;
    }

    if (cell.mine) {
      cell.exploded = true;
      cell.revealed = true;
      endGame(false);
      return;
    }

    revealFlood(coord);
    checkWin();
    draw();
  }

  function chord(coord) {
    const cell = cells.get(key(coord));
    const ns = neighbors(coord);
    const flagged = ns.filter(n => {
      const nc = cells.get(key(n));
      return nc && nc.flagged;
    }).length;
    if (flagged !== cell.adjacent) return;

    let hitMine = false;
    for (const n of ns) {
      const nc = cells.get(key(n));
      if (!nc || nc.revealed || nc.flagged) continue;
      if (nc.mine) {
        nc.exploded = true;
        nc.revealed = true;
        hitMine = true;
      } else {
        revealFlood(n);
      }
    }
    if (hitMine) {
      endGame(false);
    } else {
      checkWin();
      draw();
    }
  }

  function handleRightClick(coord) {
    if (gameOver) return;
    const cell = cells.get(key(coord));
    if (!cell || cell.revealed) return;
    cell.flagged = !cell.flagged;
    flagCount += cell.flagged ? 1 : -1;
    updateMineCounter();
    draw();
  }

  function checkWin() {
    if (revealedCount === allCoords.length - mineCount) {
      endGame(true);
    }
  }

  function updateMineCounter() {
    const remaining = Math.max(0, mineCount - flagCount);
    mineCounterEl.textContent = String(remaining).padStart(3, "0");
  }

  function startTimer() {
    timerSeconds = 0;
    timerEl.textContent = "000";
    timerHandle = setInterval(() => {
      timerSeconds = Math.min(999, timerSeconds + 1);
      timerEl.textContent = String(timerSeconds).padStart(3, "0");
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerHandle);
  }

  function coordFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) - originX;
    const py = (e.clientY - rect.top) - originY;
    return pixelToAxial(px, py);
  }

  canvas.addEventListener("click", (e) => {
    handleLeftClick(coordFromEvent(e));
  });

  canvas.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    handleRightClick(coordFromEvent(e));
  });

  function newGame() {
    stopTimer();
    const diff = DIFFICULTIES[difficultySelect.value];
    buildBoard(diff.radius);
    mineCount = Math.round(allCoords.length * diff.mineRatio);
    firstClickDone = false;
    gameOver = false;
    win = false;
    revealedCount = 0;
    flagCount = 0;
    timerSeconds = 0;
    resetBtn.textContent = "🙂";
    messageEl.textContent = "";
    messageEl.className = "";
    timerEl.textContent = "000";
    updateMineCounter();
    sizeCanvas();
    draw();
  }

  resetBtn.addEventListener("click", newGame);
  difficultySelect.addEventListener("change", newGame);
  window.addEventListener("resize", () => { sizeCanvas(); draw(); });

  newGame();
})();
</script>
</body>
</html>

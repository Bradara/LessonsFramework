<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Роботика за България 2026/2027 — Задание 1</title>
  <meta name="description" content="Задания, условия и бланки за Задание 1 от програмата Роботика за България 2026/2027." />
  <script crossorigin src="../../../libs/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18.3.1/umd/react.production.min.js'"></script>
  <script crossorigin src="../../../libs/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js'"></script>
  <script src="../../../libs/babel.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@babel/standalone/babel.min.js'"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #273549;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --info: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-primary: #f1f5f9;
        --bg-card: #ffffff;
        --bg-card-hover: #f8fafc;
        --border: #cbd5e1;
        --text: #0f172a;
        --text-muted: #475569;
      }
    }
    :root[data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--info); }
    button { font: inherit; }

    .app { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }

    header.top {
      background: linear-gradient(135deg, #1d4ed8 0%, #0f766e 100%);
      color: #fff;
      margin: 0 -16px;
      padding: 28px 24px;
      border-radius: 0 0 16px 16px;
    }
    header.top .eyebrow { font-size: 13px; opacity: .85; letter-spacing: .04em; text-transform: uppercase; }
    header.top h1 { margin: 6px 0 4px; font-size: clamp(22px, 4vw, 30px); }
    header.top p { margin: 0; opacity: .92; }

    nav.tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-primary);
      padding: 8px 0;
    }
    nav.tabs a {
      text-decoration: none;
      color: var(--text);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      transition: background .15s, border-color .15s;
    }
    nav.tabs a:hover { background: var(--bg-card-hover); }
    nav.tabs a.active { background: var(--accent); border-color: var(--accent); color: #052e16; font-weight: 600; }

    h2 { margin: 0 0 6px; font-size: clamp(20px, 3vw, 26px); }
    .lead { color: var(--text-muted); margin: 0 0 20px; max-width: 820px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform .15s, border-color .15s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card .num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #052e16;
      display: grid; place-items: center; font-weight: 700;
    }
    .card h3 { margin: 4px 0 0; font-size: 17px; }
    .card p { margin: 0; color: var(--text-muted); font-size: 14px; }
    .card .count { margin-top: auto; font-size: 13px; color: var(--info); }

    .note {
      margin-top: 24px;
      background: var(--bg-card);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .note strong { color: var(--text); }

    .layout {
      display: grid;
      grid-template-columns: minmax(240px, 300px) 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

    .doc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .doc-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .doc-btn:hover { background: var(--bg-card-hover); }
    .doc-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .doc-btn strong { font-size: 15px; }
    .doc-btn small { color: var(--text-muted); font-size: 13px; }
    .kind {
      display: inline-block;
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      width: fit-content;
    }
    .kind.pdf { background: rgba(56, 189, 248, .15); color: var(--info); }
    .kind.doc { background: rgba(34, 197, 94, .15); color: var(--accent); }

    .viewer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
    }
    .viewer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .viewer-bar h3 { margin: 0; font-size: 16px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg-card-hover);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #052e16; font-weight: 600; }
    .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }

    .pdf-frame { display: block; width: 100%; height: min(78vh, 900px); min-height: 480px; border: 0; background: #fff; }

    .doc-panel { padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
    .doc-panel h3 { margin: 0; font-size: 20px; }
    .doc-panel ol { margin: 0; padding-left: 20px; color: var(--text-muted); }
    .doc-panel ol li { margin-bottom: 6px; }

    footer { margin-top: 40px; font-size: 13px; color: var(--text-muted); text-align: center; }

    @media (max-width: 600px) {
      .app { padding: 0 12px 32px; }
      header.top { margin: 0 -12px; padding: 22px 16px; }
      .viewer-bar { padding: 10px 12px; }
      .doc-panel { padding: 20px 16px; }
      .pdf-frame { min-height: 420px; }
    }
  </style>
</head>
<body>
  <div id="root">
    <p style="padding:24px;text-align:center;color:#94a3b8">Зареждане…</p>
  </div>
  <noscript><p style="padding:24px;text-align:center">За да видите материалите, включете JavaScript.</p></noscript>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Google Drive / Docs адреси. PDF файловете се показват в iframe (/preview),
    // а Google Docs бланките се сваляха като .docx за попълване.
    const drivePreview = id => `https://drive.google.com/file/d/${id}/preview`;
    const driveView = id => `https://drive.google.com/file/d/${id}/view`;
    const driveDownload = id => `https://drive.google.com/uc?export=download&id=${id}`;
    const docDownload = id => `https://docs.google.com/document/d/${id}/export?format=docx`;
    const docEdit = id => `https://docs.google.com/document/d/${id}/edit`;

    const SECTIONS = [
      {
        id: 'ekipna',
        title: 'Екипна игра',
        intro: 'Задание 1 за екипната игра и бланката, която екипът попълва и предава.',
        items: [
          {
            type: 'pdf',
            title: 'Задание 1',
            desc: 'Условия на екипната игра (преглед в браузъра)',
            fileId: '1NywdVl1ZZx_WkgMEqHZPUUHN1CyXGSlg',
          },
          {
            type: 'doc',
            title: 'Бланка за попълване',
            desc: 'Свали за попълване на екипа (.docx)',
            docId: '1DAJG2b9Wdn68h4gogBFaXLms8DJom90r',
          },
        ],
      },
      {
        id: 'robo',
        title: 'Робо игра и Робо дизайн',
        intro: 'Мисии, точки, указания и шаблон за принтиране за Робо игра и Робо дизайн.',
        items: [
          {
            type: 'pdf',
            title: 'Мисии и точки',
            desc: 'Описание на мисиите и разпределението на точките',
            fileId: '1Ig74obOkKuNslE2YG-KeZs6Mu_mdCyIw',
          },
          {
            type: 'pdf',
            title: 'Указания',
            desc: 'Правила и указания за участие',
            fileId: '1NCAKivmzWdGf2a19gTI8uBQ1SLkNNHu9',
          },
          {
            type: 'pdf',
            title: 'Шаблон за принтиране',
            desc: 'Шаблон за отпечатване',
            fileId: '1HdIGzWiAKFIV1tS6L5iCxVHR74m8xIRz',
          },
          {
            type: 'doc',
            title: 'Бланка за попълване',
            desc: 'Свали за попълване на екипа (.docx)',
            docId: '1iV4hd2EfFaPl0CuE6FJfF6gvRraDu6ev',
          },
        ],
      },
      {
        id: 'nauchno',
        title: 'Научноизследователски проект',
        intro: 'Задание 1 за научноизследователския проект и бланката за попълване.',
        items: [
          {
            type: 'pdf',
            title: 'Задание 1',
            desc: 'Условия на научноизследователския проект (преглед в браузъра)',
            fileId: '18bA9Llbtnu_N-iXsw5ysGEC7wZG7RxI2',
          },
          {
            type: 'doc',
            title: 'Бланка за попълване',
            desc: 'Свали за попълване на екипа (.docx)',
            docId: '1pooHbgLK0KgmJs8EmKUuGL6uXTCDL9EF',
          },
        ],
      },
    ];

    function useRoute() {
      const read = () => window.location.hash.replace(/^#/, '') || 'home';
      const [route, setRoute] = useState(read);
      useEffect(() => {
        const onChange = () => setRoute(read());
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      return route;
    }

    function Home() {
      return (
        <>
          <h2>Задание 1</h2>
          <p className="lead">
            Изберете категория, за да видите условията и бланките. PDF файловете се преглеждат директно в браузъра,
            а бланките можете да свалите и попълните.
          </p>
          <div className="cards">
            {SECTIONS.map((s, i) => (
              <a key={s.id} className="card" href={`#${s.id}`}>
                <span className="num">{i + 1}</span>
                <h3>{s.title}</h3>
                <p>{s.intro}</p>
                <span className="count">
                  {s.items.length} {s.items.length === 1 ? 'материал' : 'материала'} →
                </span>
              </a>
            ))}
          </div>
          <div className="note">
            <strong>Съвет:</strong> Ако PDF файлът не се зарежда в рамката, използвайте бутона
            „Отвори на цял екран“ над него. Бланките се отварят в Word или Google Docs.
          </div>
        </>
      );
    }

    function PdfViewer({ item }) {
      return (
        <>
          <div className="viewer-bar">
            <h3>{item.title}</h3>
            <div className="actions">
              <a className="btn" href={driveView(item.fileId)} target="_blank" rel="noopener">Отвори на цял екран ↗</a>
              <a className="btn" href={driveDownload(item.fileId)} target="_blank" rel="noopener">Свали PDF</a>
            </div>
          </div>
          <iframe
            className="pdf-frame"
            src={drivePreview(item.fileId)}
            title={item.title}
          />
        </>
      );
    }

    function DocPanel({ item }) {
      return (
        <div className="doc-panel">
          <span className="kind doc">Бланка · за попълване</span>
          <h3>{item.title}</h3>
          <div className="actions">
            <a className="btn primary" href={docDownload(item.docId)} download>Свали .docx</a>
            <a className="btn" href={docEdit(item.docId)} target="_blank" rel="noopener">Отвори в Google Docs ↗</a>
          </div>
          <ol>
            <li>Натиснете „Свали .docx“ и отворете файла в Word (или го качете в Google Drive и го отворете с Google Docs).</li>
            <li>Попълнете бланката за вашия отбор.</li>
            <li>Запазете файла и го предайте според указанията на ментора.</li>
          </ol>
        </div>
      );
    }

    function SectionView({ section }) {
      const [selected, setSelected] = useState(0);
      const item = section.items[selected];
      return (
        <>
          <h2>{section.title}</h2>
          <p className="lead">{section.intro}</p>
          <div className="layout">
            <ul className="doc-list">
              {section.items.map((it, i) => (
                <li key={i}>
                  <button
                    className={`doc-btn ${i === selected ? 'selected' : ''}`}
                    onClick={() => setSelected(i)}
                    aria-pressed={i === selected}
                  >
                    <span className={`kind ${it.type}`}>{it.type === 'pdf' ? 'PDF · преглед' : 'DOCX · свали'}</span>
                    <strong>{it.title}</strong>
                    <small>{it.desc}</small>
                  </button>
                </li>
              ))}
            </ul>
            <div className="viewer">
              {item.type === 'pdf' ? <PdfViewer item={item} /> : <DocPanel item={item} />}
            </div>
          </div>
        </>
      );
    }

    function App() {
      const route = useRoute();
      const section = SECTIONS.find(s => s.id === route);
      const tabs = [{ id: 'home', title: 'Начало' }, ...SECTIONS.map(s => ({ id: s.id, title: s.title }))];
      return (
        <div className="app">
          <header className="top">
            <div className="eyebrow">Роботика за България 2026/2027</div>
            <h1>Задание 1 · Малки действия, голяма промяна</h1>
            <p>Подобри средата около теб — условия, мисии и бланки за отборите.</p>
          </header>

          <nav className="tabs">
            {tabs.map(t => (
              <a key={t.id} href={`#${t.id}`} className={(route === t.id || (!section && t.id === 'home')) ? 'active' : ''}>
                {t.title}
              </a>
            ))}
          </nav>

          <main>
            {section ? <SectionView key={section.id} section={section} /> : <Home />}
          </main>

          <footer>ППМГ Бургас · Роботика за България</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

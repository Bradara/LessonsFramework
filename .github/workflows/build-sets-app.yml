name: Build Sets Lesson App

on:
  workflow_dispatch:
  push:
    paths:
      - 'sets-app/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sets-app/src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: sets-app
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sets-lesson-${{ matrix.platform }}
          path: |
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

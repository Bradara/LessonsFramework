name: Build Sets Lesson App

on:
  workflow_dispatch:
  push:
    paths:
      - 'sets-app/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sets-app/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: sets-app/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sets-lesson-${{ matrix.platform }}
          path: |
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            sets-app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
